<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Qacano - Admin Panel & Store</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #070707; color: #fff; font-family: system-ui, -apple-system, sans-serif; }
    .gold-gradient { background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%); }
    .gold-text { background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-border { border-color: rgba(212, 175, 55, 0.3); }
    .gold-border-focus:focus { border-color: #d4af37; outline: none; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0a0a0a; }
    ::-webkit-scrollbar-thumb { background: #222; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #d4af37; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const { useState, useEffect } = React;

    // Dummy Data
    const INITIAL_PRODUCTS = [
      { id: 1, name: "Qacano Royal Watch Gold", category: "Saatlar", price: 1250, stock: 12, sales: 45, status: "Stokda var" },
      { id: 2, name: "Luxury Diamond Ring", category: "Zərgərlik", price: 3400, stock: 3, sales: 18, status: "Az qalıb" },
      { id: 3, name: "Elegance Leather Bag", category: "Aksessuar", price: 850, stock: 0, sales: 62, status: "Tükənib" },
      { id: 4, name: "Black Edition Cologne", category: "Parfüm", price: 210, stock: 40, sales: 120, status: "Stokda var" },
    ];

    const INITIAL_ORDERS = [
      { id: "ORD-9021", customer: "Əli Məmmədov", date: "2026-09-10", total: 1250, status: "Gözləyir", items: "Qacano Royal Watch Gold (1)" },
      { id: "ORD-9022", customer: "Leyla Əliyeva", date: "2026-09-09", total: 3400, status: "Tamamlandı", items: "Luxury Diamond Ring (1)" },
      { id: "ORD-9023", customer: "Rəşad Qasımov", date: "2026-09-08", total: 420, status: "Çatdırılır", items: "Black Edition Cologne (2)" },
    ];

    const CUSTOMERS = [
      { id: 1, name: "Əli Məmmədov", email: "ali@example.com", orders: 4, spent: 3450 },
      { id: 2, name: "Leyla Əliyeva", email: "leyla@example.com", orders: 2, spent: 5100 },
      { id: 3, name: "Rəşad Qasımov", email: "rashad@example.com", orders: 6, spent: 1890 },
    ];

    function App() {
      const [view, setView] = useState("admin"); // 'store' or 'admin'
      const [adminTab, setAdminTab] = useState("dashboard");
      const [products, setProducts] = useState(INITIAL_PRODUCTS);
      const [orders, setOrders] = useState(INITIAL_ORDERS);
      const [searchTerm, setSearchTerm] = useState("");
      const [filterCategory, setFilterCategory] = useState("Bütün");
      
      // New Product State
      const [newProd, setNewProd] = useState({ name: "", category: "Saatlar", price: "", stock: "" });
      const [showModal, setShowModal] = useState(false);

      const handleAddProduct = (e) => {
        e.preventDefault();
        if(!newProd.name || !newProd.price) return;
        const p = {
          id: Date.now(),
          name: newProd.name,
          category: newProd.category,
          price: parseFloat(newProd.price),
          stock: parseInt(newProd.stock) || 0,
          sales: 0,
          status: parseInt(newProd.stock) > 5 ? "Stokda var" : parseInt(newProd.stock) > 0 ? "Az qalıb" : "Tükənib"
        };
        setProducts([p, ...products]);
        setNewProd({ name: "", category: "Saatlar", price: "", stock: "" });
        setShowModal(false);
      };

      const handleOrderStatusChange = (orderId, newStatus) => {
        setOrders(orders.map(o => o.id === orderId ? { ...o, status: newStatus } : o));
      };

      const filteredProducts = products.filter(p => {
        const matchesSearch = p.name.toLowerCase().includes(searchTerm.toLowerCase());
        const matchesCat = filterCategory === "Bütün" || p.category === filterCategory;
        return matchesSearch && matchesCat;
      });

      return React.createElement("div", { className: "min-h-screen bg-[#070707] text-gray-200" },
        // Top Navigation Bar
        React.createElement("header", { className: "border-b border-[#1a1a1a] bg-[#0c0c0c] px-6 py-4 flex justify-between items-center sticky top-0 z-50" },
          React.createElement("div", { className: "flex items-center gap-3" },
            React.createElement("span", { className: "text-2xl font-bold tracking-widest gold-text" }, "QACANO"),
            React.createElement("span", { className: "text-xs bg-[#1a1a1a] text-[#d4af37] px-2.5 py-1 rounded-full border border-[#d4af37]/20 font-mono" }, "LUXURY ADMIN 2.0")
          ),
          React.createElement("div", { className: "flex items-center gap-4" },
            React.createElement("button", {
              onClick: () => setView(view === "admin" ? "store" : "admin"),
              className: "px-4 py-2 text-xs font-semibold rounded-lg border border-[#d4af37]/40 text-[#d4af37] hover:bg-[#d4af37]/10 transition-all"
            }, view === "admin" ? "Mağazaya Keçid" : "Admin Panelə Qayıt")
          )
        ),

        view === "store" 
          ? React.createElement("div", { className: "p-10 text-center" },
              React.createElement("h1", { className: "text-3xl font-bold gold-text mb-4" }, "Qacano Luxury Store View"),
              React.createElement("p", { className: "text-gray-400" }, "Mağaza ön görünüşü Rejimindəsiniz. İdarəetmə paneline keçmək üçün yuxarıdakı düyməni sıxın.")
            )
          : React.createElement("div", { className: "flex min-h-[calc(100vh-65px)]" },
              
              // Sidebar Navigation
              React.createElement("aside", { className: "w-64 border-r border-[#1a1a1a] bg-[#090909] p-4 flex flex-col gap-2 shrink-0" },
                [
                  { id: "dashboard", label: "İdarə Paneli", icon: "📊" },
                  { id: "products", label: "Məhsullar", icon: "💎" },
                  { id: "orders", label: "Sifarişlər", icon: "📦" },
                  { id: "customers", label: "Müştərilər", icon: "👥" },
                  { id: "settings", label: "Tənzimləmələr", icon: "⚙️" }
                ].map(tab => 
                  React.createElement("button", {
                    key: tab.id,
                    onClick: () => setAdminTab(tab.id),
                    className: `flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-medium transition-all ${
                      adminTab === tab.id 
                        ? "bg-[#141414] text-[#d4af37] border border-[#d4af37]/30 shadow-[0_0_15px_rgba(212,175,55,0.1)]" 
                        : "text-gray-400 hover:bg-[#111] hover:text-gray-200"
                    }`
                  }, 
                  React.createElement("span", null, tab.icon),
                  tab.label
                )
              ),

              // Main Admin Content Area
              React.createElement("main", { className: "flex-1 p-8 overflow-y-auto" },
                
                // --- TAB 1: DASHBOARD ---
                adminTab === "dashboard" && React.createElement("div", { className: "space-y-8" },
                  React.createElement("div", { className: "flex justify-between items-center" },
                    React.createElement("h2", { className: "text-2xl font-bold gold-text" }, "Ümumi İcmal"),
                    React.createElement("span", { className: "text-xs text-gray-500 font-mono" }, "Son Yenilənmə: Bu gün")
                  ),

                  // Metrics Cards
                  React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-4 gap-6" },
                    [
                      { title: "Ümumi Gəlir", value: "azn 48,950", change: "+14.2%", positive: true },
                      { title: "Ümumi Sifarişlər", value: "342", change: "+8.1%", positive: true },
                      { title: "Müştəri Sayı", value: "1,280", change: "+5.4%", positive: true },
                      { title: "Ortalama Sifariş", value: "azn 143", change: "-1.2%", positive: false }
                    ].map((card, i) => 
                      React.createElement("div", { key: i, className: "p-5 bg-[#0e0e0e] rounded-2xl border border-[#1a1a1a] shadow-sm hover:border-[#d4af37]/20 transition-all" },
                        React.createElement("div", { className: "text-xs text-gray-400 mb-1" }, card.title),
                        React.createElement("div", { className: "text-2xl font-bold text-white mb-2" }, card.value),
                        React.createElement("div", { className: `text-xs font-semibold ${card.positive ? "text-emerald-400" : "text-red-400"}` }, card.change, " müqayisədə")
                      )
                    )
                  ),

                  // Visual Progress Bars (Sales Dynamic)
                  React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-2 gap-6" },
                    React.createElement("div", { className: "p-6 bg-[#0e0e0e] rounded-2xl border border-[#1a1a1a]" },
                      React.createElement("h3", { className: "text-sm font-semibold text-gray-300 mb-4" }, "Həftəlik Satış Hədəfi"),
                      React.createElement("div", { className: "space-y-3" },
                        React.createElement("div", { className: "flex justify-between text-xs" },
                          React.createElement("span", { className: "text-gray-400" }, "Hədəf: 50,000 AZN"),
                          React.createElement("span", { className: "text-[#d4af37] font-bold" }, "97.9%")
                        ),
                        React.createElement("div", { className: "w-full bg-[#1e1e1e] h-3 rounded-full overflow-hidden" },
                          React.createElement("div", { className: "gold-gradient h-full rounded-full", style: { width: "97.9%" } })
                        )
                      )
                    ),
                    React.createElement("div", { className: "p-6 bg-[#0e0e0e] rounded-2xl border border-[#1a1a1a]" },
                      React.createElement("h3", { className: "text-sm font-semibold text-gray-300 mb-4" }, "Kateqoriya Bölgüsü"),
                      React.createElement("div", { className: "space-y-2 text-xs" },
                        [
                          { cat: "Saatlar", pct: "45%" },
                          { cat: "Zərgərlik", pct: "30%" },
                          { cat: "Aksessuarlar", pct: "25%" }
                        ].map((item, idx) => 
                          React.createElement("div", { key: idx, className: "flex justify-between p-2 bg-[#141414] rounded-lg" },
                            React.createElement("span", { className: "text-gray-300" }, item.cat),
                            React.createElement("span", { className: "text-[#d4af37] font-bold" }, item.pct)
                          )
                        )
                      )
                    )
                  )
                ),

                // --- TAB 2: PRODUCTS ---
                adminTab === "products" && React.createElement("div", { className: "space-y-6" },
                  React.createElement("div", { className: "flex justify-between items-center flex-wrap gap-4" },
                    React.createElement("h2", { className: "text-2xl font-bold gold-text" }, "Məhsulların İdarə Olunması"),
                    React.createElement("button", {
                      onClick: () => setShowModal(true),
                      className: "px-4 py-2 text-xs font-bold gold-gradient text-black rounded-xl hover:opacity-90 transition-all shadow-[0_0_15px_rgba(212,175,55,0.3)]"
                    }, "+ Yeni Məhsul Əlavə Et")
                  ),

                  // Search & Filter Controls
                  React.createElement("div", { className: "flex gap-4 bg-[#0e0e0e] p-4 rounded-2xl border border-[#1a1a1a]" },
                    React.createElement("input", {
                      type: "text",
                      placeholder: "Məhsul adı ilə axtar...",
                      value: searchTerm,
                      onChange: (e) => setSearchTerm(e.target.value),
                      className: "bg-[#141414] border border-[#222] px-4 py-2 rounded-xl text-xs w-full max-w-xs gold-border-focus"
                    }),
                    React.createElement("select", {
                      value: filterCategory,
                      onChange: (e) => setFilterCategory(e.target.value),
                      className: "bg-[#141414] border border-[#222] px-4 py-2 rounded-xl text-xs gold-border-focus"
                    },
                      ["Bütün", "Saatlar", "Zərgərlik", "Aksessuar", "Parfüm"].map(c => React.createElement("option", { key: c, value: c }, c))
                    )
                  ),

                  // Product Table
                  React.createElement("div", { className: "bg-[#0e0e0e] rounded-2xl border border-[#1a1a1a] overflow-hidden" },
                    React.createElement("table", { className: "w-full text-left text-xs" },
                      React.createElement("thead", { className: "bg-[#121212] border-b border-[#1a1a1a] text-gray-400 uppercase font-mono" },
                        React.createElement("tr", null,
                          React.createElement("th", { className: "p-4" }, "Məhsul"),
                          React.createElement("th", { className: "p-4" }, "Kateqoriya"),
                          React.createElement("th", { className: "p-4" }, "Qiymət"),
                          React.createElement("th", { className: "p-4" }, "Stok"),
                          React.createElement("th", { className: "p-4" }, "Status"),
                          React.createElement("th", { className: "p-4 text-right" }, "Əməliyyat")
                        )
                      ),
                      React.createElement("tbody", { className: "divide-y divide-[#1a1a1a]" },
                        filteredProducts.map(p => 
                          React.createElement("tr", { key: p.id, className: "hover:bg-[#121212]/50 transition-all" },
                            React.createElement("td", { className: "p-4 font-semibold text-white" }, p.name),
                            React.createElement("td", { className: "p-4 text-gray-400" }, p.category),
                            React.createElement("td", { className: "p-4 text-[#d4af37] font-bold" }, `AZN ${p.price}`),
                            React.createElement("td", { className: "p-4 text-gray-300" }, p.stock),
                            React.createElement("td", { className: "p-4" },
                              React.createElement("span", {
                                className: `px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                  p.status === "Stokda var" ? "bg-emerald-500/10 text-emerald-400 border border-emerald-500/20" :
                                  p.status === "Az qalıb" ? "bg-amber-500/10 text-amber-400 border border-amber-500/20" :
                                  "bg-red-500/10 text-red-400 border border-red-500/20"
                                }`
                              }, p.status)
                            ),
                            React.createElement("td", { className: "p-4 text-right" },
                              React.createElement("button", {
                                onClick: () => setProducts(products.filter(item => item.id !== p.id)),
                                className: "text-red-400 hover:text-red-300 text-xs font-semibold"
                              }, "Sil")
                            )
                          )
                        )
                      )
                    )
                  )
                ),

                // --- TAB 3: ORDERS ---
                adminTab === "orders" && React.createElement("div", { className: "space-y-6" },
                  React.createElement("h2", { className: "text-2xl font-bold gold-text" }, "Sifarişlərin İdarə Olunması"),
                  
                  React.createElement("div", { className: "bg-[#0e0e0e] rounded-2xl border border-[#1a1a1a] overflow-hidden" },
                    React.createElement("table", { className: "w-full text-left text-xs" },
                      React.createElement("thead", { className: "bg-[#121212] border-b border-[#1a1a1a] text-gray-400 uppercase font-mono" },
                        React.createElement("tr", null,
                          React.createElement("th", { className: "p-4" }, "Sifariş ID"),
                          React.createElement("th", { className: "p-4" }, "Müştəri"),
                          React.createElement("th", { className: "p-4" }, "Tarix"),
                          React.createElement("th", { className: "p-4" }, "Məhsullar"),
                          React.createElement("th", { className: "p-4" }, "Məbləğ"),
                          React.createElement("th", { className: "p-4" }, "Status"),
                          React.createElement("th", { className: "p-4 text-right" }, "Dəyişdir")
                        )
                      ),
                      React.createElement("tbody", { className: "divide-y divide-[#1a1a1a]" },
                        orders.map(o => 
                          React.createElement("tr", { key: o.id, className: "hover:bg-[#121212]/50 transition-all" },
                            React.createElement("td", { className: "p-4 font-mono text-[#d4af37]" }, o.id),
                            React.createElement("td", { className: "p-4 font-semibold text-white" }, o.customer),
                            React.createElement("td", { className: "p-4 text-gray-400" }, o.date),
                            React.createElement("td", { className: "p-4 text-gray-300" }, o.items),
                            React.createElement("td", { className: "p-4 text-white font-bold" }, `AZN ${o.total}`),
                            React.createElement("td", { className: "p-4" },
                              React.createElement("span", {
                                className: `px-2.5 py-1 rounded-full text-[10px] font-bold ${
                                  o.status === "Tamamlandı" ? "bg-emerald-500/10 text-emerald-400" :
                                  o.status === "Çatdırılır" ? "bg-blue-500/10 text-blue-400" :
                                  "bg-amber-500/10 text-amber-400"
                                }`
                              }, o.status)
                            ),
                            React.createElement("td", { className: "p-4 text-right" },
                              React.createElement("select", {
                                value: o.status,
                                onChange: (e) => handleOrderStatusChange(o.id, e.target.value),
                                className: "bg-[#141414] border border-[#222] text-xs px-2 py-1 rounded-lg text-gray-300 gold-border-focus"
                              },
                                ["Gözləyir", "Çatdırılır", "Tamamlandı", "Ləğv edildi"].map(s => React.createElement("option", { key: s, value: s }, s))
                              )
                            )
                          )
                        )
                      )
                    )
                  )
                ),

                // --- TAB 4: CUSTOMERS ---
                adminTab === "customers" && React.createElement("div", { className: "space-y-6" },
                  React.createElement("h2", { className: "text-2xl font-bold gold-text" }, "Müştəri Bazasının Siyahısı"),
                  React.createElement("div", { className: "grid grid-cols-1 md:grid-cols-3 gap-6" },
                    CUSTOMERS.map(c => 
                      React.createElement("div", { key: c.id, className: "p-5 bg-[#0e0e0e] rounded-2xl border border-[#1a1a1a] flex flex-col justify-between" },
                        React.createElement("div", null,
                          React.createElement("div", { className: "text-base font-bold text-white mb-1" }, c.name),
                          React.createElement("div", { className: "text-xs text-gray-400 mb-4 font-mono" }, c.email)
                        ),
                        React.createElement("div", { className: "flex justify-between border-t border-[#1a1a1a] pt-3 text-xs" },
                          React.createElement("span", { className: "text-gray-400" }, `Sifarişlər: ${c.orders}`),
                          React.createElement("span", { className: "text-[#d4af37] font-bold" }, `Xərclənib: AZN ${c.spent}`)
                        )
                      )
                    )
                  )
                ),

                // --- TAB 5: SETTINGS ---
                adminTab === "settings" && React.createElement("div", { className: "space-y-6 max-w-2xl" },
                  React.createElement("h2", { className: "text-2xl font-bold gold-text" }, "Sistem Tənzimləmələri"),
                  React.createElement("div", { className: "p-6 bg-[#0e0e0e] rounded-2xl border border-[#1a1a1a] space-y-4" },
                    React.createElement("div", null,
                      React.createElement("label", { className: "block text-xs text-gray-400 mb-2" }, "Mağaza Adı"),
                      React.createElement("input", { type: "text", defaultValue: "Qacano Luxury Store", className: "w-full bg-[#141414] border border-[#222] p-3 rounded-xl text-xs gold-border-focus" })
                    ),
                    React.createElement("div", null,
                      React.createElement("label", { className: "block text-xs text-gray-400 mb-2" }, "Valyuta"),
                      React.createElement("select", { className: "w-full bg-[#141414] border border-[#222] p-3 rounded-xl text-xs gold-border-focus" },
                        React.createElement("option", null, "AZN (₼)"),
                        React.createElement("option", null, "USD ($)"),
                        React.createElement("option", null, "EUR (€)")
                      )
                    ),
                    React.createElement("div", { className: "flex items-center justify-between pt-2" },
                      React.createElement("span", { className: "text-xs text-gray-300" }, "Avtomatik Sifariş Təsdiqi"),
                      React.createElement("input", { type: "checkbox", defaultChecked: true, className: "accent-[#d4af37]" })
                    ),
                    React.createElement("button", {
                      onClick: () => alert("Tənzimləmələr yadda saxlanıldı!"),
                      className: "px-6 py-2.5 text-xs font-bold gold-gradient text-black rounded-xl"
                    }, "Yadda Saxla")
                  )
                )
              ),

              // Modal for Adding Product
              showModal && React.createElement("div", { className: "fixed inset-0 bg-black/80 backdrop-blur-sm flex justify-center items-center z-50 p-4" },
                React.createElement("div", { className: "bg-[#0c0c0c] border border-[#d4af37]/30 p-6 rounded-2xl w-full max-w-md space-y-4" },
                  React.createElement("h3", { className: "text-lg font-bold gold-text" }, "Yeni Məhsul Əlavə Et"),
                  React.createElement("form", { onSubmit: handleAddProduct, className: "space-y-3" },
                    React.createElement("input", {
                      type: "text",
                      placeholder: "Məhsulun Adı",
                      value: newProd.name,
                      onChange: (e) => setNewProd({ ...newProd, name: e.target.value }),
                      className: "w-full bg-[#141414] border border-[#222] p-3 rounded-xl text-xs gold-border-focus"
                    }),
                    React.createElement("select", {
                      value: newProd.category,
                      onChange: (e) => setNewProd({ ...newProd, category: e.target.value }),
                      className: "w-full bg-[#141414] border border-[#222] p-3 rounded-xl text-xs gold-border-focus"
                    },
                      ["Saatlar", "Zərgərlik", "Aksessuar", "Parfüm"].map(c => React.createElement("option", { key: c, value: c }, c))
                    ),
                    React.createElement("input", {
                      type: "number",
                      placeholder: "Qiymət (AZN)",
                      value: newProd.price,
                      onChange: (e) => setNewProd({ ...newProd, price: e.target.value }),
                      className: "w-full bg-[#141414] border border-[#222] p-3 rounded-xl text-xs gold-border-focus"
                    }),
                    React.createElement("input", {
                      type: "number",
                      placeholder: "Stok Sayı",
                      value: newProd.stock,
                      onChange: (e) => setNewProd({ ...newProd, stock: e.target.value }),
                      className: "w-full bg-[#141414] border border-[#222] p-3 rounded-xl text-xs gold-border-focus"
                    }),
                    React.createElement("div", { className: "flex gap-3 pt-2 justify-end" },
                      React.createElement("button", {
                        type: "button",
                        onClick: () => setShowModal(false),
                        className: "px-4 py-2 text-xs text-gray-400 hover:text-white"
                      }, "Ləğv et"),
                      React.createElement("button", {
                        type: "submit",
                        className: "px-4 py-2 text-xs font-bold gold-gradient text-black rounded-xl"
                      }, "Əlavə et")
                    )
                  )
                )
              )
            )
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(React.createElement(App));
  </script>
</body>
</html>
